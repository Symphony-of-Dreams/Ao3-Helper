# pyproject.toml

[tool.black]
line-length = 120
target-version = ['py313']

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# E = pycodestyle Errors, F = Pyflakes, W = pycodestyle Warnings, I = isort
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
# Combina gli import sulla stessa riga, es. from PyQt6.QtWidgets import QDialog, QVBoxLayout
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = "."