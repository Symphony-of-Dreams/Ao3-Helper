# pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "ao3_helper"
version = "1.9.5" 
description = "A desktop application to manage your AO3 fanfiction archive."
requires-python = ">=3.11"
license = {text = "MIT"}


[tool.setuptools]
package-dir = {"" = "src"}

packages = { find = { where = ["src"] } }

[tool.black]
line-length = 120
target-version = ['py313']

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# E = pycodestyle Errors, F = Pyflakes, W = pycodestyle Warnings, I = isort
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]

combine-as-imports = true

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true
exclude = '(?x)(venv/|dist/)'
[[tool.mypy.overrides]]
module = [
    "AO3.*",
    "PyQt6.*",
    "keyring.*",
    "matplotlib.*",
    "wordcloud.*",
    "peewee.*",
    "playhouse.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = ["src"]
